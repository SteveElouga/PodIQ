# Pod that immediately crashes → CrashLoopBackOff
# Useful for testing analyzeIncident with a real cluster error.
apiVersion: v1
kind: Pod
metadata:
  name: podiq-test-crashloop
  namespace: default
  labels:
    podiq-test: "true"
    scenario: crashloop
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting'; exit 1"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
