[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "(^|/)(venv|\\.venv|shared/grpc|stubs)(/|$)"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["shared/grpc", "stubs", "venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "core"]

[tool.ruff.lint.per-file-ignores]
"**/app/grpc_server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
exclude = "(^|/)venv/|(^|/)\\.venv/|(^|/)shared/grpc/|(^|/)stubs/"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "stubs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.graphql.*"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true
