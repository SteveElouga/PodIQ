syntax = "proto3";

package analyzer;

service AnalyzerService {
  rpc CollectPod      (PodRequest)       returns (PodData);
  rpc ScanNamespace   (NamespaceRequest) returns (NamespaceSnapshot);
  rpc ParseManifest   (ManifestRequest)  returns (ParsedManifest);
}

// ── CollectPod ────────────────────────────────────────────────────────────────

message PodRequest {
  string pod_name  = 1;
  string namespace = 2;
  int32  log_lines = 3;  // max 2000 — tronqué dans analyzer-service
}

message PodData {
  string pod_name        = 1;
  string namespace       = 2;
  string status          = 3;
  string logs            = 4;  // tronqué à 2000 lignes, secrets masqués
  string events          = 5;
  string describe_output = 6;
}

// ── ScanNamespace ─────────────────────────────────────────────────────────────

message NamespaceRequest {
  string namespace = 1;
  int64  timestamp = 2;  // unix timestamp de l'incident pour la corrélation
}

message NamespaceSnapshot {
  string            namespace    = 1;
  repeated PodSummary pods       = 2;
  int64             collected_at = 3;
}

message PodSummary {
  string pod_name          = 1;
  string status            = 2;
  bool   has_errors        = 3;
  int64  last_restart_time = 4;
}

// ── ParseManifest ─────────────────────────────────────────────────────────────

message ManifestRequest {
  string yaml_content   = 1;
  string manifest_type  = 2;  // Deployment | StatefulSet | DaemonSet | Job | CronJob
}

message ParsedManifest {
  string          manifest_type        = 1;
  string          name                 = 2;
  string          namespace            = 3;
  repeated string env_vars             = 4;
  string          memory_limit         = 5;
  string          cpu_limit            = 6;
  bool            has_liveness_probe   = 7;
  bool            has_readiness_probe  = 8;
  string          image                = 9;
  bool            image_has_fixed_tag  = 10;
  string          raw_config           = 11;  // JSON sérialisé pour le prompt IA
}
