# Overlay activé uniquement en mode cluster réel (make up-cluster).
# Monte le kubeconfig généré par `make cluster-config` dans analyzer-service
# afin qu'il puisse appeler l'API Kubernetes du cluster minikube.
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d --build
# (géré automatiquement par `make up-cluster`)

services:
  analyzer-service:
    volumes:
      - ${KUBECONFIG_PATH:?run make cluster-config first}:/root/.kube/config:ro
    environment:
      KUBECONFIG: /root/.kube/config
    networks:
      - backend
      - minikube

networks:
  minikube:
    external: true
    name: minikube
