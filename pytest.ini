[pytest]
# Monorepo: each service uses its own `config.settings`, `pythonpath` (implicit cwd), and `app` package.
# Running `pytest` from the repo root without crawling `services/` avoids broken imports (`tests.*` would
# resolve only if each service root were on PYTHONPATH).
norecursedirs =
    services
    .git
    venv
    .venv
    node_modules
    __pycache__
    .pytest_cache
    dist
    build
    *.egg-info
asyncio_default_fixture_loop_scope = function
