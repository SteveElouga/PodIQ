exclude: ^(\.git/|venv/|\.venv/|shared/grpc/|stubs/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: local
    hooks:
      - id: hadolint-dockerfiles
        name: hadolint (Dockerfile)
        language: python
        language_version: python3.12
        additional_dependencies: [hadolint-bin==2.14.0]
        entry: hadolint
        types: [dockerfile]

      - id: mypy-services
        name: mypy (services Django)
        language: python
        language_version: python3.12
        additional_dependencies:
          - mypy==1.15.0
          - Django==5.2.1
          - djangorestframework==3.16.0
          - strawberry-graphql[django] @ https://github.com/strawberry-graphql/strawberry/archive/1eb08b2513798cd42e0f503ab9b430fb0c8b783c.tar.gz
          - psycopg[binary]==3.2.13
          - redis==6.0.0
          - dramatiq[redis]==1.18.0
          - grpcio==1.80.0
          - protobuf==6.31.1
          - python-dotenv==1.1.0
          - uvicorn==0.34.2
          - structlog==25.4.0
          - django-cors-headers==4.7.0
          - gunicorn==23.0.0
          - pytest==8.3.5
          - pytest-django==4.11.1
          - PyJWT==2.10.1
          - ollama==0.4.8
          - httpx==0.28.1
          - pydantic==2.13.4
          - kubernetes==32.0.1
          - PyYAML==6.0.2
          - argon2-cffi==23.1.0
        entry: python scripts/run_mypy_precommit.py
        types_or: [python]
        pass_filenames: true
